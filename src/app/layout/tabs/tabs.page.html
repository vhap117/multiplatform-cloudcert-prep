<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home" href="/tabs/home">
      <lucide-icon
        [name]="House"
        [size]="22"
        aria-hidden="true"
        focusable="false"
      ></lucide-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="practice" href="/tabs/practice">
      <lucide-icon
        [name]="Dumbbell"
        [size]="22"
        aria-hidden="true"
        focusable="false"
      ></lucide-icon>
      <ion-label>Practice</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="history" href="/tabs/history">
      <lucide-icon
        [name]="History"
        [size]="22"
        aria-hidden="true"
        focusable="false"
      ></lucide-icon>
      <ion-label>History</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="settings" href="/tabs/settings">
      <lucide-icon
        [name]="Settings"
        [size]="22"
        aria-hidden="true"
        focusable="false"
      ></lucide-icon>
      <ion-label>Settings</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
